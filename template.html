<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>1</title>
<link rel="icon" id="fav" href="data:,">
<style>
:root{--bg:#000;--fg:#d6d6d6;--dim:#7a7a7a;--line:#333;--hi:#fff;--bad:#d04444}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg);color-scheme:dark}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);color:var(--fg);font:16px/1.75 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono","Courier New",monospace;-webkit-font-smoothing:antialiased}
::selection{background:#fff;color:#000}
#app{width:min(620px,100%);border:1px solid var(--line);padding:clamp(26px,6vw,50px) clamp(18px,5vw,44px);transition:opacity .22s}
#app.out{opacity:0}
.num{font-size:clamp(76px,24vw,176px);line-height:1;text-align:center;color:var(--hi);margin:0 0 .22em;letter-spacing:-.05em;user-select:none}
.body{text-align:center}
.body p{margin:0 0 1.1em}
.body p.long{text-align:left}
.cipher{text-align:left;border-left:2px solid var(--line);padding:2px 0 2px 14px;letter-spacing:.04em;word-spacing:.35em;color:var(--hi);overflow-wrap:anywhere;user-select:text}
.act{margin-top:1.6em}
input{display:block;width:100%;background:#000;color:var(--hi);border:1px solid #8a8a8a;border-radius:0;padding:13px 14px;font:inherit;text-align:center;caret-color:#fff;outline:none}
input:focus{border-color:#fff;box-shadow:0 0 0 1px #fff}
input.bad{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad);animation:sh .35s}
@keyframes sh{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.coord{border:1px solid var(--hi);padding:16px 18px;text-align:center}
.coord small{display:block;color:var(--dim);letter-spacing:.14em;text-transform:uppercase;font-size:12px;margin-bottom:6px}
.coord b{font-weight:400;letter-spacing:.06em;font-size:clamp(15px,3.6vw,19px);overflow-wrap:anywhere;color:var(--hi)}
.next{display:block;margin:16px auto 0;background:none;border:1px solid var(--line);color:var(--fg);padding:8px 20px;font:inherit;cursor:pointer;border-radius:0}
.next:hover,.next:focus-visible{border-color:#fff;color:#fff;outline:none;box-shadow:0 0 0 1px #fff}
/* fase 3: campo deslocado + texto invisível (mesma cor do fundo) */
.lv-offset .body{min-height:16vh;text-align:left}
.lv-offset .ghost{color:#000;margin:0;font-size:13px;line-height:1.4;max-width:30ch;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text}
.lv-offset form{width:64%;margin-left:auto;margin-top:9vh}
/* fase 5: player */
.player{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;margin:0 0 1.2em}
.player button,.player a{font:inherit;font-size:14px;color:var(--fg);background:none;border:1px solid var(--line);padding:6px 14px;text-decoration:none;cursor:pointer;border-radius:0}
.player button:hover,.player a:hover,.player button:focus-visible,.player a:focus-visible,.player .bar:focus-visible{border-color:#fff;color:#fff;outline:none}
.player .bar{flex:1 1 160px;min-width:130px;height:16px;border:1px solid var(--line);cursor:pointer;position:relative}
.player .bar i{display:block;height:100%;width:0;background:var(--fg)}
.player .tm{font-size:13px;color:var(--dim);min-width:12ch;text-align:center}
/* fase 6: texto que só existe na página enquanto o jogador está fora da aba (aparece ~0,2s ao voltar) */
.eco{min-height:1.75em;color:var(--hi);text-align:center;overflow-wrap:anywhere;visibility:hidden;user-select:none;-webkit-user-select:none}
.eco.on{visibility:visible}
/* fase 2: texto fora da tela (existe na página, não aparece nem é selecionável; sem o atributo hidden, que some em cópias do HTML sem CSS) */
.hermes{position:absolute;left:-9999px;top:0;width:1px;height:1px;overflow:hidden;user-select:none;-webkit-user-select:none}
/* reação a resposta errada (linha discreta abaixo do campo) e caixa de dica */
.rx{min-height:1.7em;margin-top:9px;font-size:13px;line-height:1.5;color:var(--dim);text-align:center;opacity:0;transition:opacity .45s;overflow-wrap:anywhere}
.rx.on{opacity:1}
.hint{margin:22px 0 0;border:1px dashed #555;padding:13px 18px 14px;text-align:center;font-size:14px;line-height:1.75;color:var(--fg);animation:hin .9s both}
.hintbtn{display:block;margin:22px auto 0;background:none;border:1px dashed #555;color:var(--dim);padding:9px 24px;font:inherit;font-size:13px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;border-radius:0;animation:hin .9s both}
.hintbtn:hover,.hintbtn:focus-visible{border-color:#fff;color:#fff;outline:none}
.hint:focus{outline:none}
.hint small{display:block;color:var(--dim);letter-spacing:.14em;text-transform:uppercase;font-size:12px;margin-bottom:5px}
@keyframes hin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
/* fase 8: poema */
.poem .body p{margin:0 0 1.7em;line-height:1.95}
.poem .body p:first-child br:first-child{display:none}
.poem .body p:first-child{color:var(--fg)}
#logbtn{position:fixed;left:14px;bottom:12px;background:none;border:0;color:var(--dim);font:inherit;font-size:13px;cursor:pointer;padding:6px}
#logbtn:hover,#logbtn:focus-visible{color:#fff;outline:none}
#log{position:fixed;left:14px;bottom:46px;max-width:min(520px,calc(100vw - 28px));background:#000;border:1px solid #666;padding:14px 16px;font-size:13px;line-height:1.7}
#log h2{margin:0 0 8px;font-size:12px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
#log div{overflow-wrap:anywhere}
#log span{color:var(--dim);margin-right:8px}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
@media (max-width:520px){body{padding:12px}#app{border-color:#222}}
@media (prefers-reduced-motion:reduce){#app{transition:none}input.bad{animation:none}.hint,.hintbtn{animation:none}.rx{transition:none}}
</style>
</head>
<body>
<main id="app" class="lv"></main>
<button id="logbtn" type="button" hidden>registro</button>
<aside id="log" hidden></aside>
<div id="live" class="sr" aria-live="polite"></div>
<noscript>ative o javascript.</noscript>
<script>
(() => {
'use strict';
const D = /*__DATA__*/{};
const app = document.getElementById('app'), live = document.getElementById('live'),
      logbtn = document.getElementById('logbtn'), logEl = document.getElementById('log');
const enc = new TextEncoder(), dec = new TextDecoder();
const sub = window.crypto && crypto.subtle;
const ST = 'cv-estado-2', KR = 'cv-r6';
const mq = q => !!(window.matchMedia && matchMedia(q).matches);
const FADE = mq('(prefers-reduced-motion: reduce)') ? 0 : 220;

const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
const u8 = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));
const hex = buf => [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2, '0')).join('');
const rev = p => [...dec.decode(u8(p))].reverse().join('');
function el(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

// ---------- estado (guarda só o que o jogador já desbloqueou) ----------
// Guarda só as respostas (já normalizadas). O conteúdo das fases é refeito a cada carregamento,
// então qualquer ajuste de texto no site aparece para quem já tem progresso salvo.
// w = respostas erradas por fase; tm = tempo (ms) que a página ficou aberta em cada fase; h = dica já aberta (base do botão de dica).
let S = { a: [], ack: 0 };
try { const r = JSON.parse(localStorage.getItem(ST)); if (r && Array.isArray(r.a)) S = r; } catch (e) {}
if (!S.w || typeof S.w !== 'object') S.w = {};
if (!S.tm || typeof S.tm !== 'object') S.tm = {};
if (!S.h || typeof S.h !== 'object') S.h = {};
const P = []; // conteúdo desbloqueado: { c: coordenada, n: próxima fase }
const save = () => { try { localStorage.setItem(ST, JSON.stringify(S)); } catch (e) {} };
const levelOf = v => v === 1 ? D.l1 : (P[v - 2] && P[v - 2].n);

// ---------- verificação: a resposta certa é a chave que abre a próxima fase ----------
const tagOf = async (v, n) => hex(await sub.digest('SHA-256', enc.encode(D.salt + '|tag|' + v + '|' + n))).slice(0, 8);
async function tryAnswer(v, raw) {
  const n = norm(raw); if (!n) return null;
  const t = await tagOf(v, n);
  const hit = D.b[v - 1].filter(e => e.t === t);
  if (!hit.length) return null;
  const base = await sub.importKey('raw', enc.encode(n), 'PBKDF2', false, ['deriveKey']);
  const key = await sub.deriveKey({ name: 'PBKDF2', salt: enc.encode(D.salt + ':' + v), iterations: D.it, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  for (const e of hit) {
    try { return { p: JSON.parse(dec.decode(await sub.decrypt({ name: 'AES-GCM', iv: u8(e.i) }, key, u8(e.c)))), n }; } catch (_) {}
  }
  return null;
}

// ---------- reação a resposta errada (n = resposta já normalizada) ----------
async function reactTo(v, n, L) {
  for (let k = 1; k < v; k++) { // qualquer resposta aceita de uma fase anterior
    const t = await tagOf(k, n);
    if (D.b[k - 1].some(e => e.t === t)) return L.back || null;
  }
  for (const r of (L.rx || [])) if (r.k.indexOf(n) >= 0) return r.t;
  return null;
}

// ---------- dica: 5 min na fase + 3 respostas erradas liberam um botão; a dica só abre ao tocar nele (tudo fica salvo) ----------
function clock(v, L, act) {
  const NEED_MS = 5 * 60 * 1000, NEED_WRONG = 3;
  let last = Date.now(), ticks = 0, stop = null, node = null;
  const flush = () => { const now = Date.now(); S.tm[v] = (S.tm[v] || 0) + Math.min(Math.max(0, now - last), 5000); last = now; };
  const reveal = quiet => {
    const box = el('aside', 'hint'); box.setAttribute('role', 'note'); box.tabIndex = -1;
    box.append(el('small', '', 'dica'), el('span', '', L.hint));
    const hadFocus = node && document.activeElement === node;
    if (node) node.replaceWith(box); else act.append(box);
    node = box; S.h[v] = 1; save();
    if (hadFocus) box.focus({ preventScroll: true });
    if (!quiet) { live.textContent = ''; setTimeout(() => live.textContent = 'dica: ' + L.hint, 100); }
  };
  const check = () => {
    if (node || (S.tm[v] || 0) < NEED_MS || (S.w[v] || 0) < NEED_WRONG) return;
    if (stop) { stop(); stop = null; }
    if (S.h[v]) { reveal(true); return; } // já aberta antes: volta aberta ao recarregar
    node = el('button', 'hintbtn', 'dica'); node.type = 'button'; node.setAttribute('aria-label', 'abrir dica');
    node.onclick = () => reveal(false);
    act.append(node);
    live.textContent = ''; setTimeout(() => live.textContent = 'uma dica está disponível', 600);
    save();
  };
  const leave = () => { flush(); save(); };
  const vis = () => { if (document.hidden) leave(); };
  addEventListener('pagehide', leave); document.addEventListener('visibilitychange', vis);
  check();
  if (!node) stop = ticker(() => { flush(); if (++ticks % 5 === 0) save(); check(); }, 1000); // worker: segue contando com a aba em segundo plano
  return {
    wrong() { flush(); save(); check(); },
    end() { leave(); removeEventListener('pagehide', leave); document.removeEventListener('visibilitychange', vis); if (stop) stop(); }
  };
}

// ---------- fase 3 no celular: toque duplo no espaço vazio seleciona o texto invisível ----------
function dblTapGhost(root) {
  const g = root.querySelector('.ghost'); if (!g) return null;
  let lt = 0, lx = 0, ly = 0;
  const pick = () => { const r = document.createRange(); r.selectNodeContents(g); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
  const up = e => {
    if (e.pointerType === 'mouse') return; // no computador continua sendo Ctrl+A
    if (e.target && e.target.closest && e.target.closest('input,button,a,form,#log')) { lt = 0; return; }
    const t = Date.now();
    if (t - lt < 380 && Math.abs(e.clientX - lx) < 40 && Math.abs(e.clientY - ly) < 40) { lt = 0; pick(); }
    else { lt = t; lx = e.clientX; ly = e.clientY; }
  };
  document.addEventListener('pointerup', up);
  document.documentElement.style.touchAction = 'manipulation'; // sem zoom por toque duplo nesta fase
  return () => { document.removeEventListener('pointerup', up); document.documentElement.style.touchAction = ''; };
}

// ---------- favicon / título ----------
function setIcon(txt) {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d'); if (!g) return;
    g.fillStyle = '#000'; g.fillRect(0, 0, 64, 64);
    g.strokeStyle = '#fff'; g.lineWidth = 4; g.strokeRect(2, 2, 60, 60);
    g.fillStyle = '#fff'; g.font = 'bold 40px monospace'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(txt, 32, 35);
    const l = document.createElement('link'); l.rel = 'icon'; l.id = 'fav'; l.href = c.toDataURL('image/png');
    const old = document.getElementById('fav'); old ? old.replaceWith(l) : document.head.append(l);
  } catch (e) {}
}
function ticker(fn, ms) { // worker: não sofre o freio de timers das abas em segundo plano
  try {
    const u = URL.createObjectURL(new Blob(['setInterval(()=>postMessage(1),' + ms + ')'], { type: 'text/javascript' }));
    const w = new Worker(u); w.onmessage = fn;
    return () => { w.terminate(); URL.revokeObjectURL(u); };
  } catch (e) { const i = setInterval(fn, ms); return () => clearInterval(i); }
}

// ---------- comportamentos especiais ----------
const kinds = {
  audio(root, d) {
    const box = root.querySelector('.player'); if (!box) return;
    const a = new Audio(); a.preload = 'metadata'; a.src = d.src;
    const pp = el('button', '', 'tocar'); pp.type = 'button';
    const bar = el('div', 'bar'); bar.tabIndex = 0; bar.setAttribute('role', 'slider'); bar.setAttribute('aria-label', 'posição');
    bar.setAttribute('aria-valuemin', 0); bar.setAttribute('aria-valuemax', 100);
    const fill = el('i'); bar.append(fill);
    const tm = el('span', 'tm', '0:00 / –:––');
    const dl = el('a', '', 'baixar'); dl.href = d.src; dl.download = d.name || '';
    box.append(pp, bar, tm, dl);
    const fmt = s => isFinite(s) ? Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0') : '–:––';
    const upd = () => {
      const r = a.duration ? a.currentTime / a.duration : 0;
      fill.style.width = (r * 100) + '%'; bar.setAttribute('aria-valuenow', Math.round(r * 100));
      tm.textContent = fmt(a.currentTime) + ' / ' + fmt(a.duration);
    };
    ['timeupdate', 'loadedmetadata', 'durationchange'].forEach(ev => a.addEventListener(ev, upd));
    a.addEventListener('play', () => pp.textContent = 'pausar');
    a.addEventListener('pause', () => pp.textContent = 'tocar');
    a.addEventListener('ended', () => pp.textContent = 'tocar');
    a.addEventListener('error', () => { tm.textContent = 'arquivo indisponível'; });
    pp.onclick = () => { a.paused ? a.play().catch(() => {}) : a.pause(); };
    const seek = r => { if (a.duration) a.currentTime = Math.max(0, Math.min(1, r)) * a.duration; };
    bar.onclick = e => { const b = bar.getBoundingClientRect(); seek((e.clientX - b.left) / b.width); };
    bar.onkeydown = e => {
      if (e.key === 'ArrowRight') { a.currentTime = Math.min(a.duration || 0, a.currentTime + 5); e.preventDefault(); }
      if (e.key === 'ArrowLeft') { a.currentTime = Math.max(0, a.currentTime - 5); e.preventDefault(); }
    };
    return () => { a.pause(); a.removeAttribute('src'); a.load(); };
  },
  tab(root, d, v) {
    const phrase = rev(d.p), len = phrase.length, words = phrase.split(' ');
    const TOUCH = mq('(pointer: coarse)'); // celular: revela mais rápido e deixa o texto mais tempo na tela ao voltar
    const LET = TOUCH ? 600 : 1300, WORD = TOUCH ? 1400 : 2200;  // título da aba: ms por letra revelada / por palavra (depois de completa)
    const ECO = TOUCH ? 900 : 2000, FLASH = TOUCH ? 1000 : 200;  // texto na página: ms por letra revelada fora da aba / tempo visível ao voltar
    const CAP = Math.ceil(len * ECO / LET); // o progresso guardado precisa chegar até a frase inteira na página
    const eco = el('p', 'eco'); eco.setAttribute('aria-hidden', 'true');
    const body = root.querySelector('.body'); if (body) body.append(eco);
    const pageLen = u => Math.min(len, Math.max(1, Math.floor(u * LET / ECO)));
    let R = 0; try { R = Math.min(CAP, +localStorage.getItem(KR) || 0); } catch (e) {}
    let t0 = 0, stop = null, flashT = 0;
    const paint = () => {
      const units = R + 1 + (Date.now() - t0) / LET;
      let ttl, ico;
      if (units < len) {
        const s = phrase.slice(0, Math.floor(units));
        ttl = (s.length > 26 ? '…' : '') + s.slice(-26); ico = s.trim().slice(-1) || '·';
      } else {
        const w = words[Math.floor(((units - len) * LET) / WORD) % words.length]; ttl = w; ico = w[0];
      }
      document.title = ttl; setIcon(ico);
      eco.textContent = phrase.slice(0, pageLen(units)); // fica invisível (visibility:hidden) até o jogador voltar
    };
    const onVis = () => {
      if (document.hidden) {
        clearTimeout(flashT); eco.classList.remove('on');
        if (stop) return; t0 = Date.now(); paint(); stop = ticker(paint, 400);
      } else if (t0) {
        if (stop) stop(); stop = null;
        const units = R + 1 + (Date.now() - t0) / LET;
        eco.textContent = phrase.slice(0, pageLen(units));
        R = Math.min(CAP, Math.floor(units)); t0 = 0;
        try { localStorage.setItem(KR, String(R)); } catch (e) {}
        document.title = String(v); setIcon(String(v));
        eco.classList.add('on'); clearTimeout(flashT);
        flashT = setTimeout(() => { eco.classList.remove('on'); eco.textContent = ''; }, FLASH);
      }
    };
    document.addEventListener('visibilitychange', onVis);
    if (document.hidden) onVis();
    return () => { document.removeEventListener('visibilitychange', onVis); clearTimeout(flashT); if (stop) stop(); };
  }
};

// ---------- tela ----------
let cleanup = null;
function fade(fn) {
  if (!FADE) return fn();
  app.classList.add('out');
  setTimeout(() => { fn(); app.classList.remove('out'); }, FADE);
}
function renderLog(L) {
  logbtn.hidden = !(P.length && !L.clean);
  if (logbtn.hidden) logEl.hidden = true;
}
logbtn.onclick = () => {
  if (!logEl.hidden) { logEl.hidden = true; return; }
  logEl.replaceChildren(el('h2', '', 'registro'));
  P.forEach((p, i) => { const r = el('div'); r.append(el('span', '', (i + 1) + '/8'), document.createTextNode(p.c)); logEl.append(r); });
  logEl.hidden = false;
};
addEventListener('keydown', e => { if (e.key === 'Escape') logEl.hidden = true; });

function show(v) {
  if (cleanup) { cleanup(); cleanup = null; }
  const L = levelOf(v), solved = P.length >= v;
  app.className = 'lv ' + (L.cls || '');
  [...app.attributes].forEach(a => { if (a.name.indexOf('data-') === 0) app.removeAttribute(a.name); });
  for (const [k, val] of Object.entries(L.attrs || {})) if (/^data-[a-z-]+$/.test(k)) app.setAttribute(k, val); // aparece na linha do <main> no inspetor, sem precisar expandir
  app.innerHTML = (L.num ? '<div class="num">' + L.num + '</div>' : '') + '<div class="body">' + L.html + '</div><div class="act"></div>';
  document.title = String(v); setIcon(String(v));
  const act = app.querySelector('.act');
  let focusEl = null, ck = null;
  if (solved) {
    const box = el('div', 'coord'); box.setAttribute('role', 'status');
    box.append(el('small', '', 'coordenada ' + v + '/8'), el('b', '', P[v - 1].c));
    act.append(box);
    if (v < 8) {
      const b = el('button', 'next', 'continuar →'); b.type = 'button';
      b.onclick = () => { S.ack = v; save(); fade(() => show(v + 1)); };
      act.append(b); focusEl = b;
    }
  } else {
    const f = el('form'); f.autocomplete = 'off'; f.noValidate = true;
    const inp = el('input'); inp.type = 'text'; inp.name = 'r'; inp.spellcheck = false;
    inp.setAttribute('autocomplete', 'off'); inp.setAttribute('autocapitalize', 'none'); inp.setAttribute('autocorrect', 'off');
    inp.setAttribute('enterkeyhint', 'go'); inp.setAttribute('aria-label', 'resposta');
    const rx = el('div', 'rx'); rx.setAttribute('aria-hidden', 'true');
    f.append(inp, rx); act.append(f); focusEl = inp;
    const say = txt => { rx.classList.remove('on'); if (txt) { rx.textContent = txt; void rx.offsetWidth; rx.classList.add('on'); } };
    inp.addEventListener('input', () => rx.classList.remove('on'));
    let busy = false;
    f.onsubmit = async e => {
      e.preventDefault();
      if (busy || !norm(inp.value)) return;
      busy = true; inp.readOnly = true;
      const n = norm(inp.value);
      let r = null; try { r = await tryAnswer(v, inp.value); } catch (_) {}
      let msg = null; if (!r) { try { msg = await reactTo(v, n, L); } catch (_) {} }
      busy = false; inp.readOnly = false;
      if (r) { P.push(r.p); S.a.push(r.n); save(); fade(() => show(v)); }
      else {
        inp.classList.remove('bad'); void inp.offsetWidth; inp.classList.add('bad');
        live.textContent = ''; setTimeout(() => live.textContent = 'resposta incorreta' + (msg ? '. ' + msg : ''), 50);
        say(msg);
        inp.select();
        S.w[v] = (S.w[v] || 0) + 1;
        if (ck) ck.wrong(); else save();
      }
    };
  }
  const cu = [];
  if (!solved && L.hint) { ck = clock(v, L, act); cu.push(ck.end); }
  if (L.kind === 'audio' && kinds.audio) { const c = kinds.audio(app, L.data); if (c) cu.push(c); }
  if (L.kind === 'tab' && !solved) { const c = kinds.tab(app, L.data, v); if (c) cu.push(c); }
  if (!solved) { const c = dblTapGhost(app); if (c) cu.push(c); }
  cleanup = () => cu.forEach(f => f());
  renderLog(L);
  if (focusEl && !mq('(pointer: coarse)')) focusEl.focus({ preventScroll: true });
}
